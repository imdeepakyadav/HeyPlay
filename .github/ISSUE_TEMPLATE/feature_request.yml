name: ✨ Feature Request
description: Suggest an idea for HeyPlay
title: "[FEATURE] "
labels: ["enhancement", "needs-discussion"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature! 🚀
        Please make sure to search existing issues first to avoid duplicates.

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is
      placeholder: I'm always frustrated when...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen
      placeholder: I would like to...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform should this feature be implemented on?
      multiple: true
      options:
        - Web (Next.js)
        - Mobile (React Native)
        - Backend (Node.js)
        - All platforms
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What category does this feature belong to?
      options:
        - Authentication & Security
        - Music & Media
        - Real-time Communication
        - User Interface
        - Room Management
        - Social Features
        - Performance & Optimization
        - Developer Experience
        - Third-party Integrations
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered
      placeholder: Alternative approaches...

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe this feature as a user story
      placeholder: |
        As a [type of user], 
        I want [some goal] 
        so that [some reason]
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the specific requirements that must be met for this feature to be considered complete
      placeholder: |
        - [ ] Requirement 1
        - [ ] Requirement 2
        - [ ] Requirement 3
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would be helpful
        - High - Important for my use case
        - Critical - Blocking my usage
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: How complex do you think this feature would be to implement?
      options:
        - Small - A few hours of work
        - Medium - A few days of work
        - Large - A week or more of work
        - Extra Large - Multiple weeks of work
        - Unknown

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Design Ideas
      description: If you have any mockups, wireframes, or design ideas, please share them here
      placeholder: Drag and drop images here or paste them

  - type: textarea
    id: technical-considerations
    attributes:
      label: Technical Considerations
      description: Any technical details, dependencies, or implementation ideas you'd like to share
      placeholder: Technical implementation details...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request here
      placeholder: Additional information...

  - type: checkboxes
    id: research
    attributes:
      label: Research
      description: Please confirm you've done some basic research
      options:
        - label: I have searched existing issues to make sure this feature hasn't been requested before
          required: true
        - label: I have checked the documentation to see if this feature already exists
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
